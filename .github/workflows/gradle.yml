name: Java CI/CD

# Trigger pipeline on pushes to main and development branches,
# and on pull requests targeting main.
on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'refactor/**'
      - 'feat/**'
      - 'fix/**'

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Run unit tests
      - name: Run unit tests
        run: mvn -B test

      # 4. Package application without running tests again
      - name: Build with Maven
        run: mvn -B package -DskipTests

      # 5. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. Authenticate with Docker Hub (main branch only)
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7. Build Docker image
      - name: Build Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker build \
            --target runtime \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/product-managment:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/product-managment:latest \
            .

      # 8. Push Docker images
      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cart-managment:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cart-managment:latest